contract_quality_findings:
- finding: 106 of 122 operations have no operationId
  detail: >-
    Only 16 operations declare an operationId (events, bulk, Coupons,
    Genericcreate, Genericspeccreate, Entitydelete, entityget, entityupdate,
    Rewardcreate, Rewardget, Rewardupdate, Rewarddelete, listCustomers,
    getCustomer, listCustomerCoupons, listCustomerEvents,
    listCustomerTransactions - and several of those are inconsistently cased).
    Everything else must be addressed by method + path. This is why the Agent
    Skills in skills/ are grounded on METHOD + PATH rather than operationId.
- finding: servers[] names non-production hosts
  detail: >-
    16 of 18 documents declare https://api.staging.antavo.com; the Promotion
    Engine declares https://promotion.test.antavo.com/api and the Loyalty Read
    API declares the literal template https://read-api.<environment>.antavo.com.
    The production base is https://api.antavo.com. The harvested specs are left
    exactly as Antavo publishes them; see overlays/ for the recorded production
    base.
- finding: strong example coverage
  detail: >-
    Request bodies carry named, realistic `examples` maps (Standard, With
    External ID, With Multi-accounts, ...) - materially better than the catalogue
    norm and directly useful to an agent.
- finding: few reusable components
  detail: >-
    271 component schemas exist across the 18 documents but most bodies are
    declared inline per operation, so reuse across operations is low.
