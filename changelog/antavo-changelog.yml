entries:
- title: Discontinuing unsigned API requests
  url: https://developers.antavo.com/changelog/discontinuing-unsigned-api-requests
  effective_date: '2026-12-31'
  breaking: true
  additions: []
  highlights:
  - >-
    Request signing has until now been required only in production environments;
    staging and other non-production environments could authenticate with an API
    key alone.
  - >-
    That option remains available until 2026-12-31. After that date all API
    requests must be signed in every environment, and requests sent with an API
    key only will be rejected.
  - >-
    Integrators must update API clients to use signed (Escher) requests before
    the deadline; implementation detail is at
    https://developers.antavo.com/docs/api-signing.
