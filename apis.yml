aid: antavo
url: https://raw.githubusercontent.com/api-evangelist/antavo/refs/heads/main/apis.yml
name: Antavo
kind: company
description: Antavo is an enterprise loyalty management platform - the Antavo AI Loyalty Cloud -
  that lets brands build and run omnichannel, multi-brand, multi-country loyalty programs. Its API-first,
  headless Loyalty Engine exposes a comprehensive REST API covering customer events, customer profiles,
  the headless Display surface for loyalty experiences, configurable entities (rewards, challenges,
  stores, products, transactions), coupons, offers, leaderboards, clubs, promotions, and bulk operations.
  Requests use standard HTTP verbs with JSON, secured by API key/secret with optional request signing,
  IP filtering, and token-based auth. API access is provisioned per Antavo environment for enterprise
  customers, while the developer documentation is fully public.
accessModel:
  pricing: enterprise
  onboarding: unknown
  trial: false
  try_now: false
  public: false
