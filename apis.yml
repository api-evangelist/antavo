  tags:
  - Reporting
  - Customers
  - Analytics
  tags_raw:
  - Read
  - Reporting
  - Customers
  - Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.antavo.com/reference/about-loyalty-read-api
  baseURL: https://read-api.{environment}.antavo.com
  properties:
  - url: https://developers.antavo.com/docs/antavo-apis
    type: Documentation
  - url: https://developers.antavo.com/reference/about-loyalty-read-api
    type: APIReference
  - url: openapi/antavo-loyalty-read-openapi.yml
    type: OpenAPI
    name: Antavo Loyalty Read API OpenAPI
  - url: overlays/antavo-loyalty-read-overlay.yaml
    type: Overlay
    name: API Evangelist enhancements for Antavo Loyalty Read API
  description: A dedicated read-optimised API served from its own per-environment host (read-api.<environment>.antavo.com)
    for pulling loyalty data at volume. Returns paginated, filterable and sortable lists of customers,
    and per customer their coupons, events and transactions - including custom customer attributes
    configured in the workspace. This is the only Antavo surface whose operations all declare stable
    operationIds (listCustomers, getCustomer, listCustomerCoupons, listCustomerEvents, listCustomerTransactions).
  x-base-url-note: Antavo publishes this base as the literal template https://read-api.<environment>.antavo.com
    in the spec's servers[] block; the customer's assigned environment identifier fills it. read-api.antavo.com
    does not resolve (verified 2026-08-13), so no concrete host is recorded rather than guessing
    one.
