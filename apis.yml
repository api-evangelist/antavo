    type: Documentation
  - url: https://apidocs.antavo.com/api/index.html
    type: APIReference
  description: Records customer interactions from e-commerce, POS, websites, and
    mobile apps as loyalty events (for example point_add, checkout_accept), driving
    the rules and workflows of the loyalty program. Supports single and bulk event
    submission and reading a customer's event history.
