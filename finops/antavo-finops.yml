meters:
- name: platform_subscription
  description: Annual enterprise platform subscription; the primary Antavo charge.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - environment
- name: infrastructure_tier
  description: Shared vs dedicated stack, which sets the API throughput allowance and affects price.
  unit: tier
  aggregation: max
  dimensions:
  - environment
- name: api_requests
  description: REST API requests against the per-environment rate limit (1,500/min shared, 20,000/min dedicated); included in subscription, not billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - environment
- name: professional_services
  description: Onboarding, integration, and professional-services engagements billed separately.
  unit: engagement
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track API request volume against the environment's shared or dedicated rate limit to know how much headroom the contract provides.
- name: Allocation
  description: Map program modules and environments to the brands, regions, or teams that use them so the platform subscription can be split across cost centers.
- name: Optimization
  description: Offload bursty ingestion to the Async Events API and right-size the infrastructure tier (shared vs dedicated) to the actual throughput needed rather than over-provisioning.
- name: Accountability
  description: Assign an owner for the Antavo contract and review module scope, throughput tier, and services spend at renewal.
