description: >-
  FinOps view of Antavo spend. Antavo is an enterprise SaaS loyalty platform sold
  on a custom, contract-based subscription rather than public usage-metered API
  pricing. The dominant cost is the negotiated annual platform agreement, which
  varies with program complexity, customer and transaction volume, the modules
  licensed, and the infrastructure tier (shared vs dedicated stack). The REST API
  is included in the subscription subject to a per-environment rate limit, so API
  cost is effectively bounded by the plan's throughput tier rather than billed
  per call. Integration, onboarding, and professional-services engagements can be
  additional line items.
notes: >-
  Antavo does not publish per-call or per-unit API rates; spend is governed by the
  enterprise contract. Verify committed terms, module scope, and any overage or
  dedicated-stack uplift directly with Antavo during reconciliation.
