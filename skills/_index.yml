shared_safety_rules:
- >-
  NO IDEMPOTENCY. Antavo publishes no idempotency key on any of its 122
  operations. Every retried write risks a duplicate loyalty event. Read back
  before retrying; never wrap an Antavo write in an automatic retry policy.
- >-
  RATE LIMITS ARE INVISIBLE AT RUNTIME. 1,500 req/min shared stack, 20,000
  dedicated, per API key, cumulative across all endpoints except Async Events.
  No RateLimit-*, X-RateLimit-* or Retry-After header is published. Exhaustion
  is a 429 with no guidance on when to resume.
- >-
  SIGNING BECOMES UNIVERSAL ON 2026-12-31. Escher (AWS SigV4-derived) request
  signing is required in production today and in every environment after that
  date. Key-only integrations have a hard expiry.
- >-
  THE API KEY IS A QUERY PARAMETER. It will appear in proxy and access logs.
  The signature, not the key, is the authentication.
- >-
  404 IS AMBIGUOUS. It means record-not-found OR module-not-enabled-for-this-
  workspace. Never treat an Antavo 404 as proof a record is absent.
- >-
  DEPRECATIONS ARE PROSE ONLY. The legacy Rewards API, the v1 challenge
  endpoints and the Leaderboard API are all deprecated in documentation, but no
  OpenAPI operation carries `deprecated: true`. Tooling cannot see any of it.
- >-
  '-' IN A PATH IS A WILDCARD MEANING "ALL", not a placeholder. /customers/-/events
  returns events across every customer in the workspace.
- >-
  EVERY READ RETURNS MEMBER PII. Antavo holds loyalty member profiles, purchase
  history and custom attributes under ISO 27018 and GDPR. Carry that posture to
  wherever an agent renders or stores the response.
