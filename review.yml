aid: antavo
name: Antavo
review:
  question: Does Antavo expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Antavo's own public interface is a
    request/response REST API over HTTPS. Its event-driven behavior is delivered
    through inbound webhooks (external systems POST customer data into Antavo,
    registered as loyalty events) and outbound Actions/webhooks (Antavo POSTs to
    a configured HTTP endpoint), plus an Async Events API that queues events and
    is polled for status by correlation id. None of these are a server-push
    WebSocket or SSE transport on Antavo's own API, so there is no realtime
    streaming surface to model in AsyncAPI.
findings:
  summary: |
    Antavo does not publish a documented public WebSocket API. Antavo is an
    enterprise loyalty management platform (the Antavo AI Loyalty Cloud). Its
    Loyalty Engine is API-first and headless, exposing a comprehensive REST API
    over HTTPS that accepts standard HTTP verbs (GET, POST, PUT, DELETE) with
    URL-encoded and JSON request bodies and JSON responses. The API is served
    from an environment/stack-specific host of the form
    https://api.<environment>.antavo.com (referenced generically as
    https://api.antavo.com). Authentication is via an API key and secret, with
    optional request signing (HMAC), IP filtering (CIDR), and token-based auth
    through the /v1/auth/token endpoint (used by the Async Events API). No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented on Antavo's own API.
  accessModel: |
    The developer documentation (developers.antavo.com, apidocs.antavo.com,
    docs.antavo.com) is fully public and openly browsable. Live API access is
    provisioned per Antavo environment for enterprise customers - an API key and
    secret are generated in the platform's API settings, and the secret is shown
    only once. Antavo is an enterprise-only product (contact-sales pricing); there
    is no self-service public sandbox, so endpoints below are documented and
    honestly modeled from Antavo's public reference rather than exercised live
    against a provisioned account.
  eventDrivenSurface: |
    Antavo supports incoming webhooks (external systems transmit customer
    information that is registered as customer events such as point_add,
    point_sub, checkout_accept, checkout_accept_item), outbound Actions/webhooks
    to external endpoints, and an Async Events API for queued processing. These
    are HTTP request/response and HTTP callback mechanisms, not WebSocket.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.antavo.com
      documented: true
      note: Core Loyalty Engine REST API. Actual host is environment-specific, https://api.<environment>.antavo.com.
    - protocol: Webhook (incoming)
      scheme: https
      documented: true
      note: External systems POST customer data to Antavo, registered as loyalty events. Server-terminated HTTP, not WebSocket.
    - protocol: Webhook (outgoing) / Actions
      scheme: https
      documented: true
      note: Antavo POSTs event notifications to a configured external HTTP endpoint. HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Antavo's developer or API reference as of the review date.
  endpointsModeled: true
  endpointsModeledNote: |
    Endpoints below are drawn from Antavo's public developer documentation and
    llms.txt/OpenAPI index. They are documented and real, but access requires a
    provisioned enterprise environment, so they were not exercised live. Paths
    are relative to the environment-specific base host https://api.<environment>.antavo.com.
  endpointsConfirmedRest:
