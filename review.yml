actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Antavo's own public API is
    request/response REST, complemented by incoming/outgoing HTTP webhooks and a
    poll-based Async Events API. No AsyncAPI document was created because there is
    no server-push (WebSocket or SSE) transport on Antavo's own API to model.
