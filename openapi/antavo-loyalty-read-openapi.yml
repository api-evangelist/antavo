          type: string
          description: The field used to sort the results.
          enum:
          - status
          - checkout_date
          - auto_accept
          - account
          - points_rewarded
          - earned
          - burned
        direction:
          $ref: '#/components/schemas/SortDirection'
    TransactionItem:
      type: object
      description: An item included in the transaction.
      properties:
        transaction_id:
          type: string
          description: The ID of the transaction containing the item.
          example: txn_8f3c2a91d7b64e5a
        total:
          type: number
          description: The total monetary value of the item.
          example: 100
        product_id:
          type: string
          description: The ID of the product.
          example: prd_987654
        product_name:
          type: string
          description: The name of the product.
          example: Vintage Leather Jacket
        product_url:
          type: string
          format: uri
          description: The URL of the product.
          example: https://example.com/products/vintage-leather-jacket
        quantity:
          type: number
          description: The quantity of the product included in this item.
          example: 1
        points_rewarded:
          type: number
          description: The number of points assigned to this transaction item.
          example: 50
        subtotal:
          type: number
          description: The monetary value of the item after applying discounts.
          example: 50
        price:
          type: number
          description: The unit price of the product.
          example: 50
        discount:
          type: number
          description: The discount applied to the item.
          example: 0
        currency:
          type: string
          description: The currency used for the item values.
          example: EUR
        total_quantity:
          type: number
          description: The total number of purchased products.
          example: 2
    TransactionEventReference:
      type: object
      description: A summary of an event associated with the transaction.
      properties:
        _id:
          type: string
          description: The unique ID of the event.
          example: 6734a53c8bd9da0c85066e1b
        action:
          type: string
          description: The action that identifies the event type.
          example: checkout
        points:
          type: number
          description: The number of points added or deducted by the event.
          example: 0
    TransactionEntity:
      type: object
      description: 'A transaction registered for the customer, including its items, associated events,
        point values, and current processing status.

        The fields returned may vary depending on the data submitted with the transaction, the custom
        attributes configured for the corresponding events, and the transaction processing applied in
        the workspace.

        '
      properties:
        _id:
          type: string
          description: The unique ID of the transaction.
          example: txn_8f3c2a91d7b64e5a
        created_at:
          type: string
          format: date-time
          description: The date and time when the transaction was created.
          example: '2025-11-13T13:10:19+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time when the transaction was last updated.
          example: '2025-11-13T13:10:20+00:00'
        customer:
          type: string
          description: The ID of the customer associated with the transaction.
          example: 55e5d4dc2cf1901e688b45d3
        status:
          type: string
          description: The current status of the transaction.
          enum:
          - draft
          - pending
          - accepted
          - rejected
          - refunded
          example: accepted
        event:
          type: string
          description: The ID of the checkout event associated with the transaction.
          example: 6734a53c8bd9da0c85066e1b
        items:
          type: array
          description: The items included in the transaction.
          items:
            $ref: '#/components/schemas/TransactionItem'
        total:
          type: number
          description: The total monetary value of the transaction.
          example: 100
        earned:
          type: number
          description: 'The number of points credited to the customer after transaction

            processing, according to the configured point calculation rules.

            '
          example: 0
        burned:
          type: number
          description: 'The number of points deducted from the customer''s balance as part of

            the transaction.

            '
          example: 0
        events:
          type: array
          description: Events associated with the transaction.
          items:
            $ref: '#/components/schemas/TransactionEventReference'
        currency:
          type: string
          description: The currency used for the transaction.
          example: EUR
        points_rewarded:
          type: number
          description: 'The number of points assigned to the transaction. This value may be

            calculated based on the point calculation settings configured in the

            workspace or provided explicitly in the `points_rewarded` property of

            the registered checkout event.

            '
          example: 100
        account:
          type: string
          description: The ID of the point account associated with the transaction. Point accounts can
            be defined in the [Multi-accounts module](https://docs.antavo.com/docs/multi-accounts).
          example: family_account
        auto_accept:
          type: string
          format: date
          description: 'The date when the transaction is scheduled to be automatically accepted.

            This value is calculated from the pending period configured in the

            [Checkout accept module](https://docs.antavo.com/docs/checkout-accept).

            Omitted if no pending period applies.

            '
          example: '2025-12-13'
    TransactionsFilter:
      type: object
      description: 'Filter by allowed fields and operators.

        '
      properties:
        status:
          type: object
          enum:
          - draft
          - pending
          - accepted
          - rejected
          - refunded
          description: 'Filters transactions by their current transaction lifecycle status. The comparison
            operators compare values alphabetically.

            '
          properties:
            eq:
              type: string
              description: Equals.
            lt:
              type: string
              description: Less than.
            lte:
              type: string
              description: Less than or equal to.
            gt:
              type: string
              description: Greater than.
            gte:
              type: string
              description: Greater than or equal to.
        checkout_date:
          type: object
          description: 'Filters transactions by the date when the checkout transaction was registered,
            as recorded in the `checkout_date` property. The comparison operators compare values alphabetically.

            Typed as string values (as shown in the example response) even though they are date-like in
            storage.

            '
          properties:
            eq:
              type: string
              description: Equals.
            lt:
              type: string
              description: Less than.
            lte:
              type: string
              description: Less than or equal to.
            gt:
              type: string
              description: Greater than.
            gte:
              type: string
              description: Greater than or equal to.
        auto_accept:
          type: object
          description: 'Filters transactions by the date and time when they are scheduled to be automatically
            accepted. This value is calculated from the pending period configured in the [Checkout accept
            module](https://docs.antavo.com/docs/checkout-accept#interval).

            Typed as string values (as shown in the example response) even though they are date-like in
            storage.

            '
          properties:
            eq:
              type: string
              description: Equals.
            lt:
              type: string
              description: Less than.
            lte:
              type: string
              description: Less than or equal to.
            gt:
              type: string
              description: Greater than.
            gte:
              type: string
              description: Greater than or equal to.
        account:
          type: object
          description: 'Filters transactions by customer accounts configured in the [Multi-accounts module](https://docs.antavo.com/docs/multi-accounts).
            The comparison operators compare values alphabetically.

            '
          properties:
            eq:
              type: string
              description: Equals.
            lt:
              type: string
              description: Less than.
            lte:
              type: string
              description: Less than or equal to.
            gt:
              type: string
              description: Greater than.
            gte:
              type: string
              description: Greater than or equal to.
        points_rewarded:
          type: object
          description: 'Filters transactions by the number of points assigned to the transaction.

            This value may be calculated based on the point calculation settings configured in the workspace
            or provided explicitly in the `points_rewarded` property of the registered checkout event.

            Only whole numbers are accepted, decimal values return a `422` error.

            '
          properties:
            eq:
              type: integer
              description: Equals.
            lt:
              type: integer
              description: Less than.
            lte:
              type: integer
              description: Less than or equal to.
            gt:
              type: integer
              description: Greater than.
            gte:
              type: integer
              description: Greater than or equal to.
        earned:
          type: object
          description: 'Filters transactions by the number of points actually earned from the transaction.

            This value reflects the points credited to the customer after transaction processing, based
            on the workspace configuration and applicable point calculation rules.

            Only whole numbers are accepted, decimal values return a `422` error.

            '
          properties:
            eq:
              type: integer
              description: Equals.
            lt:
              type: integer
              description: Less than.
            lte:
              type: integer
              description: Less than or equal to.
            gt:
              type: integer
              description: Greater than.
            gte:
              type: integer
              description: Greater than or equal to.
        burned:
          type: object
          description: 'Filters transactions by the number of points spent as part of the transaction.
            This value reflects the points deducted from the customer''s balance during transaction processing.

            Only whole numbers are accepted, decimal values return a `422` error.

            '
          properties:
            eq:
              type: integer
              description: Equals.
            lt:
              type: integer
              description: Less than.
            lte:
              type: integer
              description: Less than or equal to.
            gt:
              type: integer
              description: Greater than.
            gte:
              type: integer
              description: Greater than or equal to.
  responses:
    Unauthorized:
      description: Error - Escher signature missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Error - Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Error - Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
tags:
- name: Customers
- name: Coupons
- name: Events
- name: Transactions
