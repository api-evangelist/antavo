          $ref: '#/components/schemas/SortDirection'
    EventEntity:
      type: object
      description: 'An event registered for the customer. The fields returned depend on the

        event type and how the event was registered.

        '
      properties:
        _id:
          type: string
          description: The unique ID of the event.
          example: 6a57a9681d81297bdc042a6e
        timestamp:
          type: string
          format: date-time
          description: The date and time when the event occurred.
          example: '2026-06-13T15:38:16+00:00'
        unix_timestamp:
          type: integer
          format: int64
          description: The time when the event occurred, represented as a Unix timestamp in seconds.
          example: 1784131896
        process_timestamp:
          type: string
          format: date-time
          description: The date and time when the event was processed by Antavo.
          example: '2026-06-13T15:38:16+00:00'
        date:
          type: string
          format: date
          description: The date when the event occurred.
          example: '2026-06-13'
        ip_address:
          type: string
          description: The IP address from which the event was registered.
          example: 87.97.9.123
        user_agent:
          type: string
          description: The user agent associated with the event request.
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        customer:
          type: string
          description: The ID of the customer associated with the event.
          example: 55e5d4dc2cf1901e688b45d3
        action:
          type: string
          description: Event type.
          example: checkout
        points:
          type: number
          description: The number of points added or deducted by the event.
          example: 60
        properties:
          type: object
          description: 'The properties registered with the event. The properties returned depend

            on the event type and the fields configured for the event.

            The example response includes `checkout`, `checkout_item`, and `point_add` events with their
            registered properties.

            '
          example:
            transaction_id: txn_8f3c2a91d7b64e5a
            total: 119.996
            points_burned: 0
            currency: GBP
        parent:
          type: string
          description: 'The ID of the parent event. Returned when the event is associated with

            another event, such as a `checkout_item` associated with a `checkout`.

            '
          example: 6a57a9681d81297bdc042a6e
        change:
          type: object
          description: 'Information about a change applied to the event.

            For example, a change may occur when the event expiration date is modified in the Management
            UI.

            '
          properties:
            id:
              type: string
              description: The ID of the original event before the change was applied.
              example: 6a57a9681d81297bdc042a6f
            at:
              type: string
              format: date-time
              description: The date and time when the event was changed.
              example: '2026-06-13T19:09:26+00:00'
            by:
              type: string
              description: The ID of the user who initiated the change.
              example: '100012233'
        admin:
          type: boolean
          description: 'Indicates whether the event was registered through the Management UI.

            The value is `true` for events registered through the Management UI and `false` for events
            registered through an API or another system process.

            '
          example: false
        hash:
          type: string
          description: 'An automatically generated hash for uniqueness checks.

            '
          example: checkout-txn_8f3c2a91d7b64e5a
        user_id:
          type: integer
          format: int64
          description: 'The ID of the Management UI user associated with the event.

            Returned only when the event was initiated by a Management UI user.

            '
          example: 100012233
        signed:
          type: boolean
          description: Indicates whether the API request that registered the event was authenticated using
            request signing.
          example: false
        expdate:
          type: string
          format: date
          description: 'The expiration date of the points earned by the event.

            Returned only when the event earns points that can expire.

            '
          example: '2026-07-16'
        source:
          type: string
          description: 'Identifies the channel or system process through which the event was registered.

            The value may indicate an API, an workflow, an import, or the manual or module operation that
            generated the event.

            '
          example: Events API
        account:
          type: string
          description: The ID of the point account affected by the event.
          example: family_account
        cid:
          type: string
          description: 'The correlation ID shared by related events registered as part of the same operation.

            '
          example: 5098a0ea-70e1-8c3b-4e4b-ac585cb9fed2
        snapshot:
          type: object
          description: The customer's point balances immediately after the event was processed.
          properties:
            score:
              type: number
              description: The customer's total earned point balance.
              example: 34749
            spent:
              type: number
              description: The customer's total spent point balance.
              example: 12167
            pending:
              type: number
              description: The customer's pending point balance.
              example: 34521
            expired:
              type: number
              description: The customer's total expired point balance.
              example: 0
        usages:
          type: object
          description: 'Shows how points earned by this event were used. Each property is keyed

            by the ID of the event that used the points, and its value is the number

            of points applied to that event.

            Omitted if no points have been used.

            '
          additionalProperties:
            type: number
          example:
            652f9bad5924e77e8269be13: 100
        used_points:
          type: number
          description: 'The total number of points earned by this event that have already been used.

            Omitted if no points have been used.

            '
          example: 100
        expired:
          type: boolean
          description: 'Indicates whether the points earned by the event are no longer available

            for use because they have been fully used or have expired.

            '
          example: true
        original:
          type: string
          description: 'The ID of the customer from whom the event was transferred during a customer merge.

            Returned only for events transferred from a merged customer.

            '
          example: 6a57a9681d81297bdc042a6f
