                      timezone: Europe/Budapest
                      promotionSelectionStrategy: biggestDiscount
                      promotionApplicationMethod: automatic
                      rounding: mathematical
                      precision: 2
                      promoCode: PROMO10
                      currency: EUR
                      cartItems:
                      - productId: '8675645322'
                        productCategoryId: Apparel & Accessories > Clothing > Shoes > Sneakers
                        quantity: '1.000'
                        unitPriceBeforeTax: '200.00'
                        tax: '40.00'
                      discounts:
                      - promotionId: 01JW4KR347PV2MA9943TD38YQS
                        promotionMetaData:
                          name: Free perfume sample
