        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /v1/cart:
    post:
      tags:
      - Cart
      summary: Submit cart details and retrieve applicable promotions
      description: 'Submit a cart to simulate promotion calculations based on its current contents and applied conditions.


        The engine will calculate which promotions are applicable to the provided cart and return:

        - Cart object

        - All matched promotions

        - The exact discounts applied

        - Adjusted unit prices (after discount)

        - Updated tax amounts

        - Total discount values


        The same `cartId` can be submitted multiple times to recalculate promotions when the cart changes.


        If any promotions have [application limits](https://docs.antavo.com/docs/configuring-promotions#application-limit-and-reset) and [locking periods](https://docs.antavo.com/docs/promotion-general-settings#locking-period), a reservation is made when the promotion is found applicable.

        If the cart is not checked out via the [/cart/finalize](https://developers.antavo.com/reference/post_v1-cart-finalize) endpoint before the lock expires, the reservation is released automatically.

        '
      security:
      - bearerAuth: []
      requestBody:
        description: Cart request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cartModel'
      responses:
        '200':
          description: Successful operation
          content:
