openapi: 3.2.0
info:
  contact: {}
  title: Antavo Promotion Engine Cart API
  version: 1.0.0
  description: Cart endpoints collection
servers:
- url: https://promotion.test.antavo.com/api
  description: The Promotion Engine test environtment
tags:
- name: Cart
  description: Cart endpoints collection
paths:
  /v1/cart/finalize:
    post:
      tags:
      - Cart
      summary: Finalize checkout with applied promotions
      description: 'Submit a cart to apply final promotion calculations and complete the checkout process.


        Similar to [/cart](https://developers.antavo.com/reference/post_v1-cart), the engine will:

        - Calculate applicable promotions

        - Apply relevant discounts to items

        - Return the adjusted cart with pricing breakdowns


        Additionally, when submitting to the this endpoint, any promotion usage limits (if any) are enforced — meaning:

        - The promotions are applied and counted toward their application limits

        - The cart cannot be resubmitted with the same `cartId`


        This endpoint can be used directly without first calling the `/cart` endpoint if you don''t require prior simulation.

        '
      security:
      - bearerAuth: []
      requestBody:
        description: Cart request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cartModel'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: Indicates the success of the request. Always `success` here.
                  metadata:
                    type: object
                    description: Reserved for future use; currently returns an empty object.
                  payload:
                    type: object
                    $ref: '#/components/schemas/cartResponse'
                    description: ''
              examples:
                itemDiscount:
                  value:
                    status: success
                    metadata: []
                    payload:
                      cartId: '66512'
                      workspaceId: '500'
                      storeId: 5077595177C60923
                      storeGroupId: Austria
                      customerId: 280e674c-c4ea-4a30-987a-d9267d1a5018
                      timezone: Europe/Budapest
                      promotionSelectionStrategy: biggestDiscount
                      promotionApplicationMethod: automatic
                      rounding: mathematical
                      precision: 2
                      promoCode: PROMO10
                      currency: EUR
                      cartItems:
                      - productId: '8675645322'
                        productCategoryId: Apparel & Accessories > Clothing > Shoes > Sneakers
                        quantity: '1.000'
                        unitPriceBeforeTax: '200.00'
                        tax: '40.00'
                      discounts:
                      - promotionId: 01JW4M2FS0CX9DQETDV142JB4M
