                      type: BadRequestException
                      code: 202019
                      message: The minimum_redemption_value must be a number
                The minimum_redemption_value must be at least 1:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202020
                      message: The minimum_redemption_value must be at least 1
                The currency attribute must be a string:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202021
                      message: The currency must be a string
                The currency attribute must contain letters only:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202022
                      message: The currency must contain only letters
                The expiration_time must be a string:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202023
