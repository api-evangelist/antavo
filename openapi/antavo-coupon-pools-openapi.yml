openapi: 3.0.0
info:
  contact: {}
  description: API endpoints for managing coupon pools
  title: Antavo Coupon Pools API
  version: 1.0.0
servers:
- url: https://api.staging.antavo.com
  description: The Antavo staging environment
paths:
  /v1/coupon-pools/{coupon_pool_id}/update:
    post:
      tags:
      - Coupon pools
      summary: Update a coupon pool
      description: This endpoint can be used to update a coupon pool with the attributes provided in the
        request body.
      parameters:
      - name: coupon_pool_id
        in: path
        description: 'The ID of the coupon pool to update which can be:

          - the ID of the coupon pool (`pool_id`) - a unique external attribute used to identify the coupon
          pool (`external_id`)'
        required: true
        schema:
          type: string
          example: 606eae8e1cb1a70e0005
      requestBody:
        required: true
        description: Request body to update the coupon pool with the specified attributes. The `update_method`
          is required. The request body can also include custom attributes (if used).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponPoolRequest'
            example:
              external_id: uniqueExternalID
              name: New coupon pool
              source: uploaded
              type: amount
              value: 12.1
              purchase_minimum: 2
              expiration_time: 2 months
              aggregated: false
              products:
              - product1
              - product2
              stores:
              - store1
              update_method: update_none
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCouponPoolResponse'
              examples:
                Coupon pool updated successfully:
                  value:
                    status: success
                    metadata:
                      update_method: update_none
                      update_matching: false
                    payload:
                      id: 146cb226c3d47e4d6a28176b
                      external_id: uniqueExternalId
                      name: New coupon pool
                      source: uploaded
                      type: amount
                      value: 12.1
                      purchase_minimum: 2
                      expiration_time: 2 months
                      aggregated: false
                      products:
                      - product1
                      - product2
                      stores:
                      - store1
        '400':
          description: 400 Bad Request Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid source attribute:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202006
                      message: Given source parameter is invalid
                The name attribute must be a string:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202008
                      message: The name must be a string
                The type attribute must be a string:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202010
                      message: The type must be a string
                Invalid type attribute:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202011
                      message: Given type parameter is invalid
                The value attribute must be a number:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202012
                      message: The value must be a number
                The value attribute must be a value with up to 2 decimal places:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202013
                      message: The value must be a value with up to 2 decimal places
                The value attribute must be at least 0.01:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202014
                      message: The value must be at least 0.01
                The purchase_minimum must be a number:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202015
                      message: The purchase_minimum must be a number
                The purchase_minimum value must be at least 1:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202016
                      message: The value must be at least 1
                The minimum_value must be a number:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202017
                      message: The minimum_value must be a number
                The minimum_value must be at least 1:
                  value:
                    status: error
