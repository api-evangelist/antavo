                      type: BadRequestException
                      code: 202031
                      message: The external_id must be unique
                The external_id must be between 6 and 24 characters:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202032
                      message: The external_id must be between 6 and 24 characters
                Missing update_method:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202033
                      message: The update_method is required
                The update_method must be a string:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202034
                      message: The update_method must be a string
                Invalid update_method attribute:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202035
                      message: Given update_method parameter is invalid
                The update_matching must be a boolean:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202038
                      message: The update_matching must be a boolean
                The minimum_value is not allowed for this type of pool:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202039
                      message: The minimum_value is not allowed for this type of pool
                The minimum_redemption_value is not allowed for this type of pool:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202040
                      message: The minimum_redemption_value is not allowed for this type of pool
                The currency is not allowed for this type of pool:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202041
                      message: The currency is not allowed for this type of pool
        '404':
          description: 404 Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Coupon pool not found:
                  summary: The coupon pool ID provided in the path does not match the ID or external ID
                    of an existing coupon pool
                  value:
                    status: error
                    error:
                      type: NotFoundException
                      code: 202001
                      message: Coupon Pool not found
