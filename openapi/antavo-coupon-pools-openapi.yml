                The stores attribute must be an array:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202027
                      message: The stores must be an array
                The stores attribute must include a valid store ID:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202028
                      message: The stores must be a valid store id
                The products attribute must be an array:
                  value:
                    status: error
                    error:
                      type: BadRequestException
                      code: 202029
                      message: The products must be an array
                The external_id must be a string:
