    PasswordRequest:
      title: PasswordRequest
      type: object
      properties:
        username:
          type: string
          description: Customer's username.
          example: john.doe
        url:
          type: string
          description: URL which will be extended with password reset token.
          example: https://loyalty.{environment}.antavo.com/{workspace_id}/customers/280e674c-c4ea-4a30-987a-d9267d1a5018
    PasswordReset:
      title: PasswordReset
      type: object
      properties:
        token:
          type: string
          description: Password reset token obtained from [password request](https://developers.antavo.com/reference/post_customers-password-request).
          example: null
        password:
          type: string
          description: Password
        confirm_password:
          type: string
          description: Confirm password - should be same as Password above.
