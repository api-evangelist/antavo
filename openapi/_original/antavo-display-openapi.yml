          example: 100
        tags:
          type: array
          items:
            type: string
          example:
          - summer-line
          - '2024'
          - 100 points
        cta_label:
          type: string
          description: Call-to-action button label.
          example: Join the Challenge
        max_completions:
          type: integer
          description: Number of times a customer can complete the challenge.
          example: 6
        progress:
          $ref: '#/components/schemas/V2ChallengeProgress'
    V2ChallengeProgress:
      type: object
      properties:
        last_completed_at:
          type: string
          format: date-type
          description: The last time time a customer completed the challenge. This is not necessarily
            the current customer.
          example: '2024-04-02T16:13:35.000Z'
        overall:
          type: number
          description: Calculated overall progress as percentage (sum of capped `current` values per sum
            of `threshold` values).
          example: 20
        criteria:
          type: array
          description: Detailed information of the customer's progress with each criteria of challenge
            completion.
          items:
            type: object
            properties:
              action:
                type: string
                description: The action to perform to complete the challenge.
                example: checkout_item
              current:
                type: integer
                description: Current progess of the customer on the challenge completion.
                example: 1
              threshold:
                type: integer
                description: The number of times the action should be performed.
                example: 5
              message:
                type: string
                description: The description of the criterium.
                example: Complete your look by purchasing 5 items from our summer clothing line and unlock
                  100 loyalty points as a reward!
              is_completed:
                type: boolean
                description: Indicates whether the customer has completed the challenge.
                example: true
    ChallengesErrorResponse:
