            to earn special rewards and make this summer your most stylish one yet.
        title:
          type: string
          description: Title of the challenge.
          example: Summer Style Challenge
        message:
          type: string
          description: Restriction message. It is only returned if the customer is currently not in the
            segment that has been selected in the reward configuration.
          example: Apologies, but this challenge is currently unavailable for you. Keep an eye out for
            future opportunities or discover other exciting challenges to engage with!
        url:
          type: string
          format: uri
          description: URL of the page that opens after the customer clicks the CTA button.
          example: https://antavo.com/summer-items
        points:
          type: integer
