  /customers/-/events:
    get:
      tags:
      - History
      summary: Retrieve a time-filtered list of every event for all customers
      description: "This endpoint returns all events for all customers that match the specified datetime\
        \ timestamp query.\nThe returned object contains the total number of matching events and an array\
        \ of every matching event.\t\n\nThe datetime filter accepts the following operators and can be\
        \ combined to generate a time window:\n\n* `gt` - greater than\n\n* `lt` - less than \n\n* `gte`\
        \ - greater than or equal\n\n * `lte` - less than or equal\n\n The timestamp filter must be in\
        \ ISODate format. Example: ``timestamp.gt=2023-01-05``,``timestamp.gt=2023-01-05T13:28:55`` or\
        \ ``timestamp.gt=2023-01-05T13:28:55.233+0000``.\n\n **Note**: The timezone offset optional parameter\
        \ (e.g., +0000) must be URL-encoded.        \n"
      parameters:
      - in: query
        name: timestamp.gt
        description: Filter events with timestamp greater than the specified value.
        schema:
          type: string
          example: '2023-01-01T00:00:00.000Z'
      - in: query
        name: timestamp.lt
        description: Filter events with timestamp less than the specified value.
        schema:
          type: string
          example: '2024-01-01T00:00:00.000Z'
      - in: query
        name: timestamp.gte
        description: Filter events with timestamp greater than or equal to the specified value.
        schema:
          type: string
          example: '2023-01-01T00:00:00.000Z'
      - in: query
        name: timestamp.lte
        description: Filter events with timestamp less than or equal to the specified value.
        schema:
          type: string
          example: '2023-01-01T00:00:00.000Z'
      - name: limit
        in: query
        description: 'Limits the number of events returned in one response. Other values are accessible
          by pagination made accessible via the offset.

          '
        schema:
          type: integer
          default: 100
          example: 50
      - name: offset
        in: query
        description: 'Offsets the starting number of events to return. Used for pagination in conjunction
          with the limit query.

          '
        schema:
          type: integer
          default: 0
      - name: order
        in: query
        description: 'Used to sort and order the results in ascending or descending order. The value can
          be `asc` for sorting the results by `_id` in an ascending order, or `desc` for sorting the results
          by `date` and `_id` in a descending order.

          '
        schema:
          type: string
          example: desc
      responses:
        '200':
          description: Time-filtered events
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: The number of events that matched the specified datetime timestamp query.
                    example: 150
                  data:
                    type: array
                    description: An array of all events matched the specified datetime timestamp query.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Event reference ID.
                          example: 5defe3e1e710bd9b018b45c7
                        action:
                          type: string
                          description: Describes the properties and behavior when processing an event.
                          example: point_add
                        label:
                          type: string
                          description: Event action display name.
                          example: Point add
                        Customer:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The Antavo unique customer ID.
                              example: 280e674c-c4ea-4a30-987a-d9267d1a5018
                        points:
                          type: integer
                          description: Number of points earned (positive) or spent (negative) with the
                            event.
                          example: 100
                        timestamp:
                          type: string
                          format: date-time
                          description: The timestamp of the event.
                          example: '2022-12-25T18:28:49.000Z'
                        properties:
                          type: array
                          description: The actual list of properties is defined by the action.
                          items:
                            $ref: '#/components/schemas/EventProperty2'
                        expdate:
                          type: string
                          pattern: /([0-9]{4})-(?:[0-9]{2})-([0-9]{2})/
                          description: The point expiry date stored as a YYYY-MM-DD string.
                          example: '2023-12-25'
  /customers/-/verify/:
    get:
      tags:
      - Customers
      summary: Verify credentials provided during registration
      description: 'This endpoint is used to confirm registration.


        A successful verification will change the status of the customer to `active` and enable them to
        log in and engage with the loyalty program. Failure will leave the customer in an `inactive` status.


        The verification process occurs using a token.


        This requires the Custom login module with the verification option enabled (disabled by default).

        '
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: The access token from the link, provided in the verfication email used to verify
            the customer.
          example: ZTM4Mjk4YTk5ZTkyZTg5NWE5N2UzNWViNjlhNGYyZDMxZmZkNGU1M2ExOGNmZTNiOWE3Y2YzZmE2ZTMyNjdiOQ.eyJjdXN0b21lciI6Im5vdF9hX3ZhbGlkX2N1c3RvbWVyIiwiZXhwaXJlc19hdCI6ImxvbmdfYWdvIn0
      - name: redirect_url
        in: query
        schema:
          type: string
          description: If provided, the user will be redirected to this URL after successful confirmation.
      responses:
        '200':
          description: Customer registration confirmed successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fail:
                  summary: Invalid token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This request token is not valid
                fail2:
                  summary: Used Token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token has already been used
                fail3:
                  summary: Expired token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token has been expired
                fail4:
                  summary: Deactivated token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token is already deactivated
      deprecated: false
