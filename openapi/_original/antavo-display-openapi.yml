        in: path
        description: "Unique customer ID. This can be \n\n* The Antavo customer ID\n* An external ID (requires\
          \ [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
        required: true
        style: simple
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
      - name: quiz_id
        in: path
        description: Unique identifier of the quiz.
        required: true
        style: simple
        schema:
          type: string
          example: 6689b5735aa0eb191451a2f5
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - answer
              type: object
              properties:
                answer:
                  type: integer
                  description: The answer as an index of the possible answers array.
                  example: 0
        required: false
      responses:
        '200':
          description: Request submitted
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AnsweringaQuizResponse'
                - $ref: '#/components/schemas/AnsweringaQuizResponseError'
              examples:
                successResponse:
                  summary: Successful answer
                  value:
                    correct_answer: true
                    message: Well done! You've just earned 100 points!
                errorResponse:
                  summary: Error in answer
                  value:
                    error:
                      type: RuntimeException
                      code: 0
                      message: This quiz is already answered by the customer.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Customer not found:
                  value:
                    type: NotFoundException
                    message: Customer not found
                    code: 160212
                Quiz not found:
                  value:
                    type: NotFoundException
                    message: Not found
                    code: 0
      deprecated: false
  /customers/{customer_id}/activities/rewards/{reward_id}/bid:
    post:
      tags:
      - Rewards
      summary: Submit a bid for the customer on a specified bidding reward
      description: 'The endpoint automatically calculates and submits a bid for a specified customer on
        the specific bidding reward. The bid amount is based on the current highest bid and the [bid step](https://docs.antavo.com/docs/rewards#bidding-rewards),
        which is set in the Antavo Management UI.


        Manually set value for bids is possible by submitting an amount in the request body.

        '
      parameters:
      - name: customer_id
        in: path
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
        required: true
        description: "Unique customer ID. This can be \n\n  * The Antavo customer ID\n  * An external\
          \ ID (requires [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
      - name: reward_id
        in: path
        schema:
          type: string
          example: 668477027cad34756c6cf005
        required: true
        description: Unique indentifier of the reward.
      requestBody:
        required: false
        description: 'A specific bidding amount has to be added to the request.  If no bid is submitted,
          the new bid amount will be the current bid + step size defined in the Management UI. '
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: A specific value for a bid. If empty, the automatic bid with a value <code>current
                    value</code> + <code>bid step</code> will be submitted.
            example:
              amount: 160
      responses:
        '200':
          description: Bid successfully submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidResponse'
        '400':
          description: Reward is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Reward is not active:
                  value:
                    type: BadRequestException
                    message: Reward is not active
                    code: 160321
        '404':
          description: Customer or reward not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Customer not found:
                  value:
                    type: NotFoundException
                    code: 160212
                    message: Customer not found
                Reward not found:
                  value:
                    type: NotFoundException
                    message: Not Found
                    code: 0
  /customers/{customer_id}/activities/rewards/{reward_id}/claim:
    post:
      tags:
      - Rewards
      summary: Claim a reward for a specific customer
      description: This endpoint allows for claiming a reward for a customer.
      parameters:
      - name: customer_id
        in: path
        required: true
        description: "Unique customer ID. This can be \n\n  * The Antavo customer ID\n  * An external\
          \ ID (requires [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
      - name: reward_id
        in: path
        required: true
        description: Unique reward ID.
        schema:
          type: string
          example: 63dcb7736123782ba6336425
      - name: fields
        in: query
        schema:
          type: string
          enum:
          - customer
          - reward
        description: "Returns additional objects in the response, using a comma separated list. Options:\
          \ \n\n- **customer**: The complete customer response object with all customer attributes.\n\
          - **reward**: The complete reward object with all reward attributes.\n"
      requestBody:
        required: false
        description: "A request body is **only** required for specific scenarios. \n\n1. Dynamic rewards:\
          \ The stated points are used to calculate the value of the generated dynamic coupon.  \n\n2.\
          \ Making multiple claims in a single API request: Repeated identical reward claims can be combined\
          \ into an single request, reducing API traffic.\n"
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                points:
                  type: integer
                  description: Points to be used when claiming a dynamic type of reward.
                  example: 700
                count:
                  type: integer
                  description: The number of times that the reward is claimed in a single API request.
                    This is only needed for multiple claims.
                  example: 2
      responses:
        '200':
          description: Claim result. A coupon object is returned only for coupon rewards.
          content:
            application/json:
              schema:
                type: object
                required:
                - spent
                properties:
                  spent:
                    type: integer
                    description: The number or points spent to claim the reward.
                    example: 700
                  id:
                    type: string
                    description: ID of the reward claim event
                  last_claimed_at:
                    type: string
                    format: date-type
                    description: The last time the customer claimed the reward.
                    example: '2021-11-23T08:34:59.000Z'
                  coupon:
                    $ref: '#/components/schemas/CouponClaim'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                Reward is not active:
                  value:
                    type: BadRequestException
                    message: Reward is not active
                    code: 160321
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Customer not found:
                  value:
                    type: NotFoundException
                    code: 160212
                    message: Customer not found
  /customers/{customer_id}/activities/rewards/{reward_id}/revoke:
    post:
      tags:
      - Rewards
      summary: Revoke a previously claimed reward
      description: This endpoint revokes a specific reward claim.
      parameters:
      - name: customer_id
        in: path
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
        required: true
        description: "Unique customer ID. This can be \n\n  * The Antavo customer ID\n  * An external\
          \ ID (requires [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
      - name: reward_id
        in: path
        schema:
          type: string
          example: 668434f93d963535a513bf37
        required: true
        description: Unique indentifier of the reward.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: The unique indentifier of the reward claim event.
                  example: 66676986c688963c28608f0c
      responses:
        '200':
          description: Successful revoke
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Claim cannot be revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Claim already revoked:
                  value:
                    type: BadRequestException
                    code: 160344
                    message: Claim event already revoked
                Event not found:
                  value:
                    type: BadRequestException
                    code: 160340
                    message: Event not found
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Customer not found:
                  value:
                    type: NotFoundException
                    code: 160212
                    message: Customer not found
  /customers/{customer_id}/opt-in:
    post:
      tags:
      - Customers
      summary: Create a new customer with log-in credentials
      description: "This endpoint creates customer within Antavo according to the specified opt-in parameters\
        \ stated in the body. \n\nThis interface is primarily used as a customer-driven registration process\
        \ which also generates login credentials, enabling the new customer to log into Antavo systems.\
        \ This endpoint complements the [opt-in](https://developers.antavo.com/docs/api-events#opt_in)\
        \ event.\n"
      parameters:
      - name: customer_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
      requestBody:
        description: Customer opt-in parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Optin'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fail:
                  summary: Customer already exists
                  value:
                    type: BadRequestException
                    code: 0
                    message: Customer already exists
                fail2:
                  summary: Missing Path parameter
                  value:
                    type: BadRequestException
                    code: 0
                    message: 'Missing path param: customer_id'
      deprecated: false
  /customers/-/login:
    post:
      tags:
      - Customers
      summary: Log in a specific customer to Antavo
      description: 'This endpoint logs the specified customer into Antavo and a successful login returns
        the customer object.


        The username attribute can be specified in the Antavo Management UI from any available profile
        attribute.

        The customer ID can then be accessed and used for subsequent calls using Antavo Display API endpoints.


        A successful log-in will also create a ``daily_login`` event for the customer.

        This event will only be written once to the customer''s event stream per calendar day.


        This requires the Custom login module to be enabled.

        '
      requestBody:
        description: Login request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fail:
                  summary: Wrong username/password
                  value:
                    type: BadRequestException
                    code: 0
                    message: Invalid username or password
      deprecated: false
  /customers/-/password/request:
    post:
      tags:
      - Customers
      summary: Request a new password for Antavo login
      description: 'A forgotten password can be reset through this endpoint.

        The username can be set in the Customer login module in the Management UI and can be any customer
        profile attribute.

        The `url` string is a URL which can be extended with the reset token.

        '
      requestBody:
        description: Password reset request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fail:
                  summary: Customer not found
                  value:
                    type: BadRequestException
                    code: 0
                    message: Customer not found
      deprecated: false
  /customers/-/password/reset:
    post:
      tags:
      - Customers
      summary: Reset the password of the current customer
      description: 'This provides a customer interface for changing a password. The token is captured
        from the link provided by the password reset email. A simple check is provided to ensure that
        the two passwords match.

        This requires the Custom login module to be enabled.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The token used for password reset.
                    example: ZTM4Mjk4YTk5ZTkyZTg5NWE5N2UzNWViNjlhNGYyZDMxZmZkNGU1M2ExOGNmZTNiOWE3Y2YzZmE2ZTMyNjdiOQ.eyJjdXN0b21lciI6Im5vdF9hX3ZhbGlkX2N1c3RvbWVyIiwiZXhwaXJlc19hdCI6ImxvbmdfYWdvIn0
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fail:
                  summary: Invalid token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This request token is not valid
                fail2:
                  summary: Used Token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token has already been used
                fail3:
                  summary: Expired token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token has been expired
                fail4:
                  summary: Deactivated token
                  value:
                    type: BadRequestException
                    code: 0
                    message: This token is already deactivated
                fail5:
                  summary: Non-matching Passwords
                  value:
                    type: BadRequestException
                    code: 0
                    message: Passwords do not match
      deprecated: false
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      description: Provides API Key access to the endpoint
      in: query
  schemas:
    ChallengeActivity:
      type: object
      properties:
        id:
          type: string
          description: The unique ID of the challenge.
          example: 63eaabe8b0fe6815c91425b6
        title:
          type: string
          description: Title of the challenge.
          example: Summer Style Challenge
        description:
          type: string
          description: Description of the challenge.
          example: Embrace the season with our exclusive Summer Style Challenge! Purchase a full set from
            our vibrant summer clothing line and showcase your fashion-forward look. Complete the challenge
            to earn special rewards and make this summer your most stylish one yet.
        status:
          type: string
          description: Current status of the challenge.
          enum:
          - active
          - restricted
        image:
          $ref: '#/components/schemas/Image'
        points:
          type: integer
          description: The number of points rewarded when the customer completes the challenge.
          example: 100
        progress:
          type: object
          description: Returned for active challenges only.
          properties:
            last_completed_at:
              type: string
              format: date-type
              description: The last time time a customer completed the challenge. This is not necessarily
                the current customer.
              example: '2024-04-02T16:13:35.000Z'
            overall:
              type: number
              description: Calculated overall progress as percentage (sum of capped `current` values per
                sum of `threshold` values).
              example: 20
            criteria:
              type: array
              description: Detailed information of the customer's progress with each criteria of challenge
                completion.
              items:
                type: object
                properties:
                  action:
                    type: string
                    description: The action to perform to complete the challenge.
                    example: checkout_item
                  current:
                    type: integer
                    description: Current progess of the customer on the challenge completion.
                    example: 1
                  threshold:
                    type: integer
                    description: The number of times the action should be performed.
                    example: 5
                  message:
                    type: string
                    description: The description of the criterium.
                    example: Complete your look by purchasing 5 items from our summer clothing line and
                      unlock 100 loyalty points as a reward!
                  is_completed:
                    type: boolean
                    description: Indicates whether the customer has completed the challenge.
                    example: true
        cta_label:
          type: string
          description: Call-to-action button label.
          example: Join the Challenge
        url:
          type: string
          format: uri
          description: URL of the page that opens after the customer clicks the CTA button.
          example: https://antavo.com/summer-items
        starts_at:
          type: string
          format: date-time
          description: Start date of the challenge, if defined.
          example: '2024-02-29T14:30:00.000Z'
        ends_at:
          type: string
          format: date-time
          description: End date of the challenge, if defined.
          example: '2024-08-31T14:29:00.000Z'
        completions:
          type: integer
          description: Number of times the customer has completed the challenge.
          example: 0
        max_completions:
          type: integer
          description: Number of times a customer can complete the challenge.
          example: 6
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the challenge.
          example:
          - summer-line
          - '2024'
          - 100 points
        category:
          type: string
          description: Category of the challenge.
          example: Stay stylish!
    ErrorResponse:
      type: object
      description: This describes the structure returned if an error occurred
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              description: Type of the error occurred.
              example: BadRequestException
            code:
              type: number
              description: Error code.
              example: 113401
            message:
              type: string
              description: Human readable error message.
              example: Missing required parameter 'parameter_name'
    Image:
      type: object
      description: Object contains different sizes of the image asset.
      properties:
        small:
          type: string
          format: uri
          example: https://example.com/1715791767-nH7Mf.jpeg
        medium:
          type: string
          format: uri
          example: https://example.com/1715791767-nH7Mf.jpeg
        large:
          type: string
          format: uri
          example: https://example.com/1715791767-nH7Mf.jpeg
    ContentConsumptionActivityEndpoint:
      type: object
      properties:
        title:
          type: string
          description: Title of the activity
          example: Learn about our Summer Campaign!
        activity_type:
          type: string
          description: Type of the point-earning activity.
          example: content_consumption
        status:
          type: string
          enum:
          - active
          description: Status of the content-type activity. This endpoint will always return `active`
            status.
          example: active
        points:
          type: integer
          description: Points to earn.
          example: 100
        type:
          type: string
          enum:
          - visit
          - video
        url:
          type: string
          description: URL of the content to visit.
          example: https://example.com/summer-campaign
    ContestActivity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the contest.
          example: 5ea6b6bc127abc45008b456f
        title:
          type: string
          description: Title of the contest.
          example: Win 2x VIP Tickets for the New York Fashion Week!
        description:
          type: string
          description: Description of the contest.
          example: Enter our sweepstakes for a chance to win 2x VIP tickets to one of the most exclusive
            events in the industry.
        end_date:
          type: string
          example: '2024-12-31T14:29:00.000Z'
          description: End date of the contest.
        start_date:
          type: string
          example: '2024-06-29T15:11:00.000Z'
          description: Start date of the contest.
        display_until:
          type: string
          example: '2025-01-31T14:29:00.000Z'
          description: Date until the contest should be visible for customers.
        completion_text:
          type: string
          example: The contest has ended. Winners will be announced soon.
          description: Text that appears after a content has ended.
        status:
          type: string
          enum:
          - active
          - scheduled
          - expired
          - completed
          - restricted
        image:
          $ref: '#/components/schemas/Image'
        points:
          type: integer
          example: 500
          description: Points price of a contest entry.
        terms:
          type: string
          description: Terms & Conditions.
          example: To enter the sweepstakes, participants must redeem 500 loyalty points for each entry.
            Participants may enter the sweepstakes up to a maximum of 3 times.
        progress:
          description: Information about the customer' activity.
          type: object
          properties:
            max:
              type: integer
              description: Maximum number of times a customer can enter the contest.
              example: 3
            current:
              type: integer
              description: Number of times the customer has already entered.
              example: 2
            is_completed:
              type: boolean
              description: Indicates if the customer has already reached the entry limit.
              example: false
        _action:
          type: object
          properties:
            complete:
              type: object
              properties:
                method:
                  type: string
                  example: POST
                  description: Type of request to be submitted.
                answer:
                  type: string
                  format: uri
                  description: Endpoint to submit a contest entry.
                  example: /customers/280e674c-c4ea-4a30-987a-d9267d1a5018/activities/contests/6644e797d959c7036f18762a/enter
    ImageSet:
      type: object
      description: Object containing image URLs of various sizes.
      properties:
        small:
          description: URL of the small-sized image, or false/null if not available.
          example: https://example.com/images/small.jpg
        medium:
          description: URL of the medium-sized image, or false/null if not available.
          example: https://example.com/images/medium.jpg
        large:
          description: URL of the large-sized image, or false/null if not available.
          example: https://example.com/images/large.jpg
    ProgressCriterion:
      type: object
      description: Individual criterion contributing to the overall progress.
      properties:
        action:
          type: string
          description: Action to complete (e.g., `checkout_item`, `visit`)
          example: checkout_item
        message:
          type: string
          description: Criterion description.
          example: Complete your look by purchasing 3 items from our summer clothing line and unlock 100
            loyalty points as a reward!
        threshold:
          type: integer
          description: Number of actions required to complete this criterion.
          example: 3
        current:
          type: integer
          description: Number of actions already completed.
          example: 1
        is_completed:
          type: boolean
          description: Indicates whether the action criterion has been met.
          example: false
    Progress:
      type: object
      description: Progress details of the customer's challenge completion.
      properties:
        overall:
          type: number
          description: Overall progress percentage.
          example: 33.3
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ProgressCriterion'
          description: Challenge criteria details.
        last_completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the customer's last completion of the challenge, if any.
          example: '2025-05-12T10:30:00Z'
    GamifiedReviews:
      type: object
      description: Activity encouraging users to leave reviews. If the Multi-accounts module is used,
        the response includes point logic settings for all configured accounts.
      properties:
        id:
          type: string
          nullable: true
          description: Identifier of the activity. Currently always `null`.
          example: null
        status:
          type: string
          description: Status of the activity. Always `active`.
          enum:
          - active
          example: active
        title:
          type: string
          description: Title of the review writing activity.
          example: Leave a review
        description:
          type: string
          description: Description shown to the user.
          example: Share your thoughts about your recent purchase and earn points.
        image:
          $ref: '#/components/schemas/ImageSet'
        points:
          type: string
          description: Number of points awarded for writing a review. If Multi-accounts is enabled, this
            refers to the point vaule applied to the default account.
          example: 50
        activity_type:
          type: string
          enum:
          - review
          description: Type of the activity. Always `review`.
          example: review
        default_account:
          type: string
          description: ID of the default account.
          example: default_account
        accounts:
          type: object
          description: Object containing all point logic settings for each specific account.
          additionalProperties:
            type: object
            properties:
              points:
                description: Number of points awarded for each review.
                type: integer
                example: 10
              weekly_limit:
                description: The number of reviews that are awarded by points each week.
                type: integer
                example: 1
          example:
            default_account:
              points: 10
              weekly_limit: 1
    SocialFollow:
      type: object
      description: Activity encouraging users to follow a social media profile.
      properties:
        id:
          type: string
          nullable: true
          description: Identifier of the activity. Currently always `null`.
          example: null
        status:
          type: string
