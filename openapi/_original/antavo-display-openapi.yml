  /customers/{customer_id}/events:
    get:
      tags:
      - History
      summary: List all Antavo events associated with a customer
      description: 'This endpoint returns a detailed list of events and the corresponding actions recorded
        with the specified customer ID. This information can be used as a customer activity source and
        can also be accessed using the `/history`endpoint.

        The event history/log/stream can be pre-filtered by specific event actions and paginated by limiting
        and offsetting the number of returned events. The response also includes event expiration dates,
        if set.


        This endpoint was historically known as `/customers/{customer_id}/history`. This endpoint is still
        valid and all options listed below are also applicable.

        '
      parameters:
      - name: customer_id
        in: path
        required: true
        description: "Unique customer ID. This can be \n\n* The Antavo customer ID\n* An external ID (requires\
          \ [configuration](/docs/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
        example: 280e674c-c4ea-4a30-987a-d9267d1a5018
        schema:
          type: string
      - name: limit
        in: query
        description: 'Limits the number of events returned in one response. Other values are accessible
          by pagination made accessible via the offset.

          '
        schema:
          type: integer
          default: 100
          example: 50
      - name: offset
        in: query
        description: 'Offsets the starting number of events to return. Used for pagination in conjunction
          with the limit query.

          '
        schema:
          type: integer
          default: 0
      - name: order
        in: query
        description: 'Used to sort and order the results in ascending or descending order. The value can
          be `asc` for sorting the results by `_id` in an ascending order, or `desc` for sorting the results
          by `date` and `_id` in a descending order.

          '
        schema:
          type: string
          example: desc
      - name: actions
        in: query
        description: A legacy field consisting of comma separated list of actions to filters the type
          of returned Antavo events.
        example: checkout,checkout_accept
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
        description: "The events history can be filtered by submitted event actions using operators. Refer\
          \ to [API events](/docs/api-events) and [internal events](/docs/internal-events) lists. \nThis\
          \ filter query can be used in conjunction with [operators](/docs/pagination-filtering-and-ordering#query-operators).\
          \ The filter should be submitted as a parameter in the following format: `field.operator(optional)=value`.\n\
          \nFiltering of events containing a `transaction_id` is also possible. This requires the action\
          \ query to contain all related events and for an additional query using `properties.transaction_id`.\n\
          Example: \n`action.in=checkout,checkout_accept&properties.transaction_id.in=c078c162-88af-4369-89a4-408958a8cb75`.\
          \ \nThese combined filters can also use [filtering operators](/docs/pagination-filtering-and-ordering#query-operators).\
          \ \nThe `transaction_id` field in any custom event must be set as filterable.\n"
      - name: date
        in: query
        example: date.gt=2023-01-01
        schema:
          type: string
        description: "The events history can be filtered by a specific date. Specific start and/or end\
          \ dates can be stated by using multiple operators (e.g., `date.gt=2020-01-01&date.lt=2022-02-01`).\n\
          The UTC timezone should be considered when sending the request.\t\n"
      - name: points_only
        in: query
        schema:
          type: boolean
        example: false
        description: Filter to only show non-zero points events (events that award or subtract points).
      - name: references
        in: query
        schema:
          type: boolean
        example: true
        description: Include the ID and name of any associated challenges/rewards in the response.
      responses:
        '200':
          description: Customer event history data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  prev:
                    type: string
                    format: uri
                    description: Links to the previous page of the event feed; present only when `limit`
                      is set.
                    example: /customers/280e674c-c4ea-4a30-987a-d9267d1a5018/events?limit=100&offset=200
                  next:
                    type: string
                    format: uri
                    description: Links to the next page of the event feed; present only when `limit` is
                      set.
                    example: /customers/280e674c-c4ea-4a30-987a-d9267d1a5018/events?limit=100&offset=400
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomernotfoundErrorResponse'
