  /customers/{customer_id}/transactions/-/search:
    get:
      tags:
      - Transactions
      summary: Search transactions for a specific customer using criteria
      description: 'This endpoint provides transactional-based searches for a specific customer. Customer
        transactions can be filtered by transaction ID and status, and highly selective queries can be
        generated using the generic entity [filtering](/docs/pagination-filtering-and-ordering#filtering).

        Example:

        `GET /customers/001/transactions/-/search?id.in=trx01,trx02,trx03&status=pending`


        All inline examples within this documentation uses simple matching.


        This endpoint has a 8k request URI limit, this corresponds to approximately 5000 transaction IDs
        which are less than 15 character in length.

        Higher volumes of filtering are possible using the [POST Method](/post_customers-customer-id-transactions-search).

        '
      parameters:
      - name: customer_id
        in: path
        description: "Unique customer ID. This can be \n\n * The Antavo customer ID\n * An external ID\
          \ (requires [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
        required: true
        style: simple
        schema:
          type: string
      - name: id
        in: query
        description: The target transaction ID of the specified customer. This example uses a simple match,
          but complex filtering is possible using generic entity [filter parameters](/docs/pagination-filtering-and-ordering#filtering)
        schema:
          type: string
          example: TR37882412
      - name: status
        in: query
        description: Transactions can be filtered by status. This example uses a simple match but complex
          filtering is possible using  generic entity [filter parameters](/docs/pagination-filtering-and-ordering#filtering)
        schema:
          type: string
          enum:
          - accepted
          - pending
          - refunded
          - rejected
          - draft
        required: false
      - name: offset
        in: query
        description: Offsets the starting number of transactions to return. This is used in pagination
          in conjunction with the limit query.
        style: form
        explode: true
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Limits the number of transactions returned in one response. Other values are accessible
          by pagination made accessible via the offset.
        style: form
        explode: true
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: The transaction history data for a specific transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
    post:
      tags:
      - Transactions
      summary: Perform bulk transaction search for a specific customer
      description: 'This endpoint provides the option of high-volume transaction-based searching.


        Customer transactions can be filtered by transaction ID and status provide in the request body.

        Highly selective queries can be generated using the generic entity [filtering](/docs/pagination-filtering-and-ordering#filtering).

        '
      parameters:
      - name: customer_id
        in: path
        description: "Unique customer ID. This can be \n\n  * The Antavo customer ID\n  * An external\
          \ ID (requires [configuration](/docs/customers#external-identifiers)): ``{external_field:external_id_value}``\n"
        required: true
        style: simple
        schema:
          type: string
          example: 280e674c-c4ea-4a30-987a-d9267d1a5018
      requestBody:
        description: "Generally, the `id` field will be used in conjunction with the `in` operator to\
          \ search a JSON array or comma separated values in a string. \n"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transrequest'
            example:
              id.in:
              - trx01
              - trx02
              - trx03
              status: pending
      responses:
        '200':
          description: The transaction history data for a specific transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
      deprecated: false
