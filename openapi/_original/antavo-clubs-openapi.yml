                    club_template_percentage: 5
                    expiration_date: '2025-06-30T12:00:00Z'
                - type: object
                  title: club_point_spent
                  description: Properties for club_point_spent.
                  properties:
                    points:
                      type: number
                  example:
                    points: 50
                - type: object
                  title: club_point_add or club_point_remove
                  description: Properties for club_point_add, club_point_remove.
                  properties:
                    points:
                      type: number
                    reason:
                      type: string
                      nullable: true
                  example:
                    points: 50
                    reason: purchase
                - type: object
                  title: club_ownership_assign or club_ownership_revoke
                  description: Properties for club_ownership_assign, club_ownership_revoke.
                  properties:
                    actor:
                      type: string
                      nullable: true
                  example:
                    actor: 22cc313988befe60e3413e76
                - type: object
                  title: club_point_donation
