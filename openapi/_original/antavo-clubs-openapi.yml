      description: 'This endpoint allows a registered loyalty member to join a private club as an active
        club member.


        When a member joins, the `club_member_join` event is automatically registered in both the club''s
        and customer''s event history.

        '
      parameters:
      - name: invitation_id
        in: path
        required: true
        description: The unique identifier of the invitation.
        schema:
          type: string
          example: 66cc313988befe60e3413e75
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: Channel through which the member is joining (optional).
                  example: friend referral
      responses:
        '200':
          description: Successful response indicating the member has joined the private club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinResponse'
        '400':
          description: Bad request response indicating an issue with the request for joining a private
            club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinBadRequestResponse'
        '404':
          description: Not found response indicating the requested private club invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinNotFoundResponse'
components:
