                  properties:
                    actor:
                      type: string
                      nullable: true
                  example:
                    actor: 22cc313988befe60e3413e76
                - type: object
                  title: club_member_ban
                  description: Properties for club_member_ban.
                  properties:
                    actor:
                      type: string
                      nullable: true
                    previous_status:
                      type: string
                      nullable: true
                  example:
                    actor: 22cc313988befe60e3413e76
                    previous_status: active
                - type: object
                  title: club_member_remove
                  description: Properties for club_member_remove.
                  properties:
                    actor:
                      type: string
                      nullable: true
                    previous_status:
                      type: string
                      nullable: true
                    status:
                      type: string
                      nullable: true
                  example:
                    actor: 22cc313988befe60e3413e76
                    previous_status: active
                    status: banned
                - type: object
                  title: club_member_unban
                  description: Properties for club_member_unban.
                  properties:
                    actor:
                      type: string
                      nullable: true
                    status:
                      type: string
                      nullable: true
                  example:
                    actor: 22cc313988befe60e3413e76
                    previous_status: active
                - type: object
                  title: club_member_join
