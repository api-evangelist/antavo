  note: Antavo advertises an error reference in two places and publishes no error-code table at either.
    The only runtime way to read a full Antavo error is the Management UI API browser error log at /api-browser/errors,
    which 'shows every request and its subsequent response that results in an error' - workspace-gated,
    and therefore unavailable to an agent. Titles and remediation above are derived from the response
    descriptions in the specs and from the documented platform behaviour, not invented.
