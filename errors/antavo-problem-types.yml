  - openapi/antavo-bulk-operations-openapi.yml#GET /v1/bulk-operation/reward/claim/{batch_id}/status
  - openapi/antavo-bulk-operations-openapi.yml#GET /v1/bulk-operation/reward/claim/{batch_id}/status/error
  - openapi/antavo-bulk-operations-openapi.yml#POST /v1/bulk-operation/coupons/{coupon_pool_id}/{action}
  - openapi/antavo-bulk-operations-openapi.yml#POST /v1/bulk-operation/customer-list/add/{customer_list_id}
- status: 422
  title: Unprocessable Entity
  occurrences: 4
  descriptions: []
  remediation: The request was syntactically valid but semantically rejected - typically a loyalty rule
    refusing the action (insufficient points, reward out of stock, challenge not available to this customer).
  media_types: []
  example_operations:
