  - openapi/antavo-bulk-operations-openapi.yml#POST /v1/bulk-operation/customer-list/remove/{customer_list_id}
  - openapi/antavo-bulk-operations-openapi.yml#POST /v1/bulk-operation/reward/claim/{reward_id}
  - openapi/antavo-clubs-openapi.yml#GET /v1/clubs
- status: 401
  title: Unauthorized
  occurrences: 8
  descriptions:
  - Unauthorized. Client authentication failed.
  - Unauthorized. Token authentication failed.
  - UnauthorizedException
  remediation: The api_key query parameter is missing/invalid, the Escher signature did not match the
    server-side computation, or the bearer token has expired. Signatures must be recomputed per request
    - they are not reusable. Token lifetime is 300-3600 seconds.
  media_types:
  - application/json
  example_operations:
  - openapi/antavo-async-events-openapi.yml#POST /v1/async/events
  - openapi/antavo-authentication-openapi.yml#POST /v1/auth/token
  - openapi/antavo-leaderboard-openapi.yml#GET /customers/leaderboard
