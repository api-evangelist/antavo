  - openapi/antavo-loyalty-read-openapi.yml#listCustomerTransactions
  - openapi/antavo-loyalty-read-openapi.yml#listCustomers
- status: 403
  title: Forbidden
  occurrences: 5
  descriptions: []
  remediation: The workspace IP filter (CIDR allow-list, configured per endpoint in Management UI > API
    settings > IP filter) rejected the caller's source address, or signature enforcement is enabled for
    this endpoint and the request was sent with a plain API key.
  media_types: []
  example_operations:
  - openapi/antavo-promotion-engine-openapi.yml#GET /v1/promotion/{promotionId}
  - openapi/antavo-promotion-engine-openapi.yml#GET /v1/promotions
  - openapi/antavo-promotion-engine-openapi.yml#POST /v1/cart
  - openapi/antavo-promotion-engine-openapi.yml#POST /v1/cart/finalize
  - openapi/antavo-promotion-engine-openapi.yml#POST /v1/promotion/{promotionId}/status
- status: 404
  title: Not Found
  occurrences: 79
  descriptions:
  - 404 Not Found
  - A response indicating that the specified club could not be found.
  - A response indicating that the specified club or member could not be found.
  - Bad request
  - Club not found.
  - Club or club member not found.
  remediation: The addressed customer, entity, reward, coupon, club or transaction does not exist in this
    workspace, or the module that owns the endpoint is not enabled for the workspace. Antavo returns 404
    for module-not-enabled as well as record-not-found, so a 404 is not by itself proof the record is
    absent.
  media_types:
  - application/json
  example_operations:
  - openapi/antavo-bulk-operations-openapi.yml#GET /v1/bulk-operation/coupons/{batch_id}/status
  - openapi/antavo-bulk-operations-openapi.yml#GET /v1/bulk-operation/coupons/{batch_id}/status/error
  - openapi/antavo-bulk-operations-openapi.yml#GET /v1/bulk-operation/customer-list/{batch_id}/status
