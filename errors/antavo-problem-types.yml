generated: '2026-08-13'
method: derived
source: the 18 OpenAPI documents in openapi/, plus https://developers.antavo.com/docs/api-browser and
  a live 404 observed at https://api.antavo.com/
format: vendor
rfc9457: false
description: Error catalogue derived from every 4xx/5xx response declared across Antavo's 18 published
  OpenAPI documents, enriched from the documented error envelope. Antavo does NOT use RFC 9457 application/problem+json
  - every error is application/json carrying a vendor envelope whose stable machine key is a numeric `code`,
  not a URI type.
envelopes:
- id: standard
  applies_to: all REST endpoints
  shape: '{"error": {"type": "<ExceptionClassName>", "code": <int>, "message": "<string>"}}'
  fields:
  - error.type
  - error.code
  - error.message
  observed: https://api.antavo.com/ returned this envelope on a live 404 probe, 2026-08-13
  note: '`type` is a server exception class name (NotFoundException, BadRequestException). `code` is 0
    on the generic gateway 404 and a five/six-digit number on domain errors.'
- id: oauth-token
  applies_to: POST /v1/auth/token
  shape: '{"status": "error", "error": "<oauth_error>", "details": {"type": "<ExceptionClassName>", "code":
    <int>, "message": "<string>"}}'
  fields:
  - status
  - error
  - details.type
  - details.code
  - details.message
  oauth_error_values:
  - invalid_request
  - invalid_grant
  - unauthorized_client
  - unsupported_grant_type
  - invalid_scope
  known_codes:
  - 220011
  - 220012
  - 220013
  - 220014
  - 220015
  note: The only place in the whole surface where Antavo publishes an enumerated set of error codes in
    the spec itself.
problems:
- status: 400
  title: Bad Request
  occurrences: 62
  descriptions:
  - 400 Bad Request Exception
  - A response indicating that the request parameters were invalid.
  - A response indicating that the request was invalid. This response may contain different errors, such
    as limit, offset, or query parameter errors.
  - Bad Request error responses for banning members.
  - Bad Request error responses for disbanding a club.
  - Bad Request error responses for owner assignments.
  remediation: Validate the request body and query parameters against the operation schema. On POST /v1/auth/token
    the OAuth envelope names the specific fault in `error` (invalid_request, invalid_grant, unauthorized_client,
    unsupported_grant_type, invalid_scope) and the numeric cause in details.code.
  media_types:
  - application/json
  example_operations:
  - openapi/antavo-async-events-openapi.yml#GET /v1/async/events/{correlation_id}
  - openapi/antavo-async-events-openapi.yml#POST /v1/async/events
  - openapi/antavo-authentication-openapi.yml#POST /v1/auth/token
  - openapi/antavo-bulk-operations-openapi.yml#POST /v1/bulk-operation/coupons/{coupon_pool_id}/{action}
