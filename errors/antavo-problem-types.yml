  - openapi/antavo-loyalty-read-openapi.yml#listCustomerTransactions
  - openapi/antavo-loyalty-read-openapi.yml#listCustomers
- status: 500
  title: Internal Server Error
  occurrences: 1
  descriptions: []
  remediation: Unhandled server error. Retry with backoff. Note that Antavo publishes no idempotency key,
    so retrying a write may duplicate the event - reconcile before retrying a POST.
  media_types: []
  example_operations:
  - openapi/antavo-promotion-engine-openapi.yml#POST /v1/promotion/{promotionId}/status
- status: 5XX
  title: Server Error
  occurrences: 5
  descriptions: []
  remediation: Server-side failure class declared as a wildcard response. Retry with backoff; see the
    500 note on duplicate risk.
  media_types: []
