method: searched
source: >-
  npm registry (registry.npmjs.org search + package metadata), Packagist
  (packagist.org/packages/list.json?vendor=antavo + repo.packagist.org/p2),
  github.com/antavo, and https://developers.antavo.com/docs/api-signing
note: >-
  Antavo publishes no self-service SDK page; the client libraries below were
  found by searching the public registries for the `antavo` vendor/scope plus
  the Escher signing libraries the API signing documentation links to by name.
  Every first-party package carries a version and a published date read from
  the registry metadata endpoint. THE CURRENCY FINDING IS THE HEADLINE: the
  newest first-party Antavo release on any registry is @antavo/microsite-sdk-node
  3.9.5-DEV from 2021-10-06, and the newest non-prerelease is
  @antavo/api-async-client-node 1.0.1 from 2021-06-08 - roughly five years
  behind the REST API these libraries wrap, whose reference pages were last
  updated in 2026. Antavo's own developer documentation does not link to any of
  them; it points integrators at the Postman collection and at generic Escher
  implementations instead.
