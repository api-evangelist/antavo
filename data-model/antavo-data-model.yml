source: openapi/ (18 documents, 122 operations) + https://developers.antavo.com/docs/customers, https://developers.antavo.com/docs/transactions,
  https://developers.antavo.com/docs/actions-events
description: 'Entity-relationship graph derived from Antavo''s published OpenAPI: component schema $ref
  links, array item refs, and the resource graph implied by the URI paths. Antavo''s core is a customer-centric
  event store - a Customer accumulates Events, Events roll up into Transactions and point balances, and
  every other object (reward, challenge, coupon, offer, club, promotion) is a configurable entity a customer
  can act on.'
root_entity:
  name: Customer
  identifier: customer_id
  id_format: UUID v4 (e.g. 280e674c-c4ea-4a30-987a-d9267d1a5018) as shown throughout the published examples
  alternate_keys:
  - external_id - an identifier from the integrator's own system, accepted on event submission to link
    records
  wildcard: A literal '-' in the customer position means 'all customers' (GET /customers/-/events)
  note: Nearly every path in the platform is rooted at /customers/{customer_id}; the Display API alone
    hangs 41 paths off it.
core_domains:
- domain: events
  description: Customer interactions submitted through the Events API or Async Events API and recorded
    on the member's event history. The event `action` (point_add, checkout, opt_in, ...) is the platform's
    central vocabulary.
  vocabulary: https://developers.antavo.com/docs/api-events
- domain: transactions
  description: Purchases assembled from checkout* events, carrying items, status (pending/accepted/rejected),
    points earned and burned.
  docs: https://developers.antavo.com/docs/transactions
- domain: activities
  description: 'The Display API aggregation of everything a member can earn or spend on: challenges, rewards,
    offers, coupons, quizzes, contests, prize wheels, profiling flows, treasure hunts, content consumption.'
  hypermedia: each activity embeds an `_actions` map giving the method + relative URL of its next legal
    transition
- domain: entities
  description: The configurable building blocks - rewards, challenges, stores, products, transactions,
    customer lists - addressed generically as /entities/{module}/{entity}.
  note: This one path carries 17 of the 122 operations; the entity TYPES are workspace configuration,
    not spec-declared, so the schema of an entity is not knowable from the OpenAPI.
- domain: clubs
  description: Member communities with templates, membership, invitations, applicants, bans, ownership,
    point donation and adjustment, and history. 22 operations, the second largest surface.
  note: Clubs have their own point balance distinct from the customer account balance; club_point_donation
    converts one into the other.
- domain: promotions
  description: Cart-level promotion evaluation. POST /v1/cart simulates and reserves; POST /v1/cart/finalize
    commits and counts usage against application limits.
  note: Served from a different host (promotion.test.antavo.com/api) than the rest of the platform.
- domain: accounts
  description: Multi-account points economy. Events may name an `account`; when none is given the event
    lands on the default account.
  note: Requires the Points economy module.
