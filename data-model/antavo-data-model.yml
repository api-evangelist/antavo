caveats:
- Antavo's specs declare comparatively few reusable components.schemas - most request and response bodies
  are declared inline per operation, so this graph under-represents the true model. The resource_graph
  below, derived from URI structure, is the more complete view.
- Custom customer attributes, custom entity modules and translation objects are workspace configuration
  and appear in responses without being declared in any spec. Antavo explicitly warns clients to tolerate
  undocumented response fields.
