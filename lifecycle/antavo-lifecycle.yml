deprecated_operations: []
note_on_deprecated_operations: >-
  No harvested OpenAPI operation carries the machine-readable `deprecated: true`
  flag. Every deprecation Antavo publishes is prose in a summary, description or
  changelog entry - which means an automated client cannot detect any of the
  surfaces listed above. That gap is the single most actionable lifecycle finding
  in this profile.

status_page:
  url: https://antavo.com/status/
  model: per-environment
  note: >-
    Antavo does not run one aggregate status page. https://antavo.com/status/ is
    an index that links a separate status host per customer stack - each returns
    its own page (verified: https://status.eu6.antavo.com/ -> "Antavo Stack EU6
    Status", HTTP 200). A customer must know which stack their workspace runs on
    to monitor the right one. No status JSON/RSS API and no Statuspage/Instatus
    vendor endpoint was found on any of them.
  stacks:
  - https://status.eu6.antavo.com/
  - https://status.eu7.antavo.com/
  - https://status.eu8.antavo.com/
  - https://status.eu9.antavo.com/
  - https://status.eu11.antavo.com/
  - https://status.eu71.antavo.com/
  - https://status.us.antavo.com/
  - https://status.us6.antavo.com/
  - https://status.us7.antavo.com/
  - https://status.st1.antavo.com/
  - https://status.st2.antavo.com/
