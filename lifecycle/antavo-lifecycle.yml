generated: '2026-08-13'
method: searched
source: >-
  https://developers.antavo.com/changelog,
  https://developers.antavo.com/changelog/discontinuing-unsigned-api-requests,
  https://developers.antavo.com/docs/antavo-apis,
  https://antavo.com/status/, https://status.eu6.antavo.com/,
  and the 18 OpenAPI documents in openapi/

versioning:
  scheme: uri-path
  current: mixed - unversioned, v1 and v2 endpoints coexist
  docs: https://developers.antavo.com/docs/antavo-apis
  note: >-
    There is no single API version. Legacy surfaces are unversioned (/events,
    /customers, /rewards, /coupons, /offers, /entities), newer surfaces carry
    /v1 (/v1/auth/token, /v1/async/events, /v1/clubs, /v1/promotions,
    /v1/bulk-operation, /v1/cart, /v1/coupon-pools, /v1/social-share-campaigns)
    and the challenge endpoints have a /v2 generation that supersedes the
    unversioned pair. Antavo publishes no version-negotiation header, no
    date-pinned versions and no supported-version window.

deprecation:
  policy_url: https://developers.antavo.com/changelog
  policy_name: Deprecations
  sunset_header: false
  deprecation_header: false
  note: >-
    Antavo renames the ReadMe changelog module to "Deprecations" and uses it as
    a dated breaking-change notice board rather than a release feed. It carries
    an effective date per entry. There is NO RFC 8594 Sunset header, no
    Deprecation header, and no stated minimum notice period - the guarantee is
    editorial, not machine-readable.
  entries:
  - title: Discontinuing unsigned API requests
    url: https://developers.antavo.com/changelog/discontinuing-unsigned-api-requests
    effective: '2026-12-31'
    breaking: true
    summary: >-
      Request signing has so far been mandatory only in production, with staging
      and other non-production environments accepting a plain API key. After
      2026-12-31 all API requests must be signed in every environment and
      key-only requests will be rejected.
    action_required: >-
      Update every API client and integration to send Escher-signed requests
      before the deadline.

